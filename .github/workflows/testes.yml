name: Testes

on:
  push:
  pull_request:

jobs:
  testes:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verificar
      - run: npm test
      # Usa o Google Chrome que já vem nas máquinas do GitHub (nenhum navegador é baixado).
      - run: npm run teste:interface
